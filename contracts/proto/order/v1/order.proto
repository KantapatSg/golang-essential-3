syntax = "proto3";
package order.v1;
option go_package = "github.com/KantapatSg/golang-essential-3/contracts/gen/go/order/v1;orderv1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
}
message Money { int64 amount_minor = 1; string currency = 2; }
message OrderItem { string product_id = 1; string name = 2; int32 quantity = 3; Money unit_price = 4; Money line_total = 5; }
message Order { string id = 1; string customer_id = 2; repeated OrderItem items = 3; Money total = 4; string status = 5; string payment_scenario = 6; string reason = 7; string created_at = 8; string updated_at = 9; }
message CreateOrderItem { string product_id = 1; int32 quantity = 2; }
message CreateOrderRequest { string customer_id = 1; repeated CreateOrderItem items = 2; string payment_scenario = 3; string idempotency_key = 4; }
message ListOrdersRequest { int32 page = 1; int32 page_size = 2; }
message ListOrdersResponse { repeated Order orders = 1; int32 total = 2; }
message GetOrderRequest { string id = 1; }
