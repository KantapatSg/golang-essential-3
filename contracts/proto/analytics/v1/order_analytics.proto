syntax = "proto3";
package analytics.v1;
option go_package = "github.com/KantapatSg/golang-essential-3/contracts/gen/go/analytics/v1;analyticsv1";

service OrderAnalyticsService { rpc OrderSummary(OrderSummaryRequest) returns (OrderSummaryResponse); rpc OrderFunnel(OrderSummaryRequest) returns (OrderFunnelResponse); }
message OrderSummaryRequest { string from = 1; string to = 2; }
message OrderSummaryResponse { int64 created = 1; int64 confirmed = 2; int64 rejected = 3; int64 cancelled = 4; int64 revenue_minor = 5; string currency = 6; string through = 7; }
message OrderFunnelResponse { int64 created = 1; int64 reserved = 2; int64 paid = 3; int64 confirmed = 4; int64 rejected = 5; int64 cancelled = 6; string through = 7; }
