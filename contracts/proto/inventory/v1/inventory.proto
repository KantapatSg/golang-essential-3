syntax = "proto3";
package inventory.v1;
option go_package = "github.com/KantapatSg/golang-essential-3/contracts/gen/go/inventory/v1;inventoryv1";

service InventoryService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc ListInventory(ListInventoryRequest) returns (ListProductsResponse);
  rpc QuoteProducts(QuoteProductsRequest) returns (QuoteProductsResponse);
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse);
  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse);
  rpc ListStockMovements(ListStockMovementsRequest) returns (ListStockMovementsResponse);
}
message Product { string id = 1; string name = 2; int64 unit_price_minor = 3; string currency = 4; int32 available = 5; }
message ProductRequestItem { string product_id = 1; int32 quantity = 2; }
message ListProductsRequest { int32 page = 1; int32 page_size = 2; }
message ListInventoryRequest { int32 page = 1; int32 page_size = 2; }
message ListProductsResponse { repeated Product products = 1; int32 total = 2; }
message QuoteProductsRequest { repeated ProductRequestItem items = 1; }
message QuoteProductsResponse { repeated Product products = 1; int64 total_minor = 2; string currency = 3; }
message ListReservationsRequest { int32 page = 1; int32 page_size = 2; }
message Reservation { string id = 1; string order_id = 2; string product_id = 3; int32 quantity = 4; string status = 5; string reason = 6; string created_at = 7; }
message ListReservationsResponse { repeated Reservation reservations = 1; int32 total = 2; }
message AdjustStockRequest { string product_id = 1; int32 delta = 2; string reason = 3; string idempotency_key = 4; }
message StockMovement { string id = 1; string product_id = 2; int32 delta = 3; string reason = 4; int32 balance_after = 5; string idempotency_key = 6; string created_at = 7; }
message AdjustStockResponse { Product product = 1; StockMovement movement = 2; bool replayed = 3; }
message ListStockMovementsRequest { string product_id = 1; int32 page = 2; int32 page_size = 3; }
message ListStockMovementsResponse { repeated StockMovement movements = 1; int32 total = 2; }
