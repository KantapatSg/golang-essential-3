syntax = "proto3";
package task.v1;
option go_package = "github.com/KantapatSg/golang-essential-3/contracts/gen/go/task/v1;taskv1";

service TaskService { rpc ListTasks(ListTasksRequest) returns (ListTasksResponse); rpc GetTask(GetTaskRequest) returns (Task); rpc CreateTask(CreateTaskRequest) returns (Task); rpc UpdateTask(UpdateTaskRequest) returns (Task); rpc DeleteTask(DeleteTaskRequest) returns (Empty); }
message Task { string id = 1; string owner_id = 2; string title = 3; string description = 4; string status = 5; string created_at = 6; string updated_at = 7; }
message ListTasksRequest {}
message ListTasksResponse { repeated Task tasks = 1; }
message GetTaskRequest { string id = 1; }
message CreateTaskRequest { string title = 1; string description = 2; }
message UpdateTaskRequest { string id = 1; string title = 2; string description = 3; string status = 4; }
message DeleteTaskRequest { string id = 1; }
message Empty {}
