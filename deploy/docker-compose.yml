services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    volumes: [ ./postgres-init:/docker-entrypoint-initdb.d:ro ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d app"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # kafka-topics starts a JVM for each probe, so Docker Desktop can need more
    # than five seconds even after the broker is accepting connections.
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"], interval: 10s, timeout: 15s, retries: 20 }
  clickhouse:
    # Pin the LTS minor line while using the Debian-based image. The Alpine
    # variant can share a stale containerd layer on some Docker Desktop builds.
    image: clickhouse/clickhouse-server:24.8
    # สร้าง application user ที่อนุญาตเฉพาะ network ของ compose; default user
    # ของ ClickHouse อาจตอบ 403 เมื่อ query มาจาก container อื่น แม้ /ping จะผ่าน
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: [ clickhouse-data:/var/lib/clickhouse, ../services/analytics-service/migrations:/docker-entrypoint-initdb.d:ro ]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"], interval: 5s, timeout: 3s, retries: 20 }
  keygen:
    # One-shot local init owns only key creation; application containers remain
    # non-root and mount the completed key pair with the minimum access needed.
    build: { context: .., dockerfile: deploy/keygen.Dockerfile }
    environment: { JWT_KEY_DIR: /keys }
    volumes: [ keys:/keys ]
  identity-service:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: identity-service } }
    environment:
      IDENTITY_ADDR: ":50051"
      IDENTITY_DB_DSN: "postgres://app:app@postgres:5432/identity_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    volumes: [ keys:/keys ]
    depends_on:
      keygen: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:50051:50051"]
  task-service:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: task-service } }
    environment:
      TASK_ADDR: ":50052"
      TASK_DB_WRITE_DSN: "postgres://app:app@postgres:5432/task_db?sslmode=disable"
      TASK_DB_READ_DSN: "postgres://app:app@postgres:5432/task_db?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:9092"
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, kafka: { condition: service_healthy } }
    ports: ["127.0.0.1:50052:50052"]
  activity-service:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: activity-service } }
    environment:
      ACTIVITY_ADDR: ":50053"
      ACTIVITY_DB_DSN: "postgres://app:app@postgres:5432/activity_db?sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
    depends_on: { postgres: { condition: service_healthy }, kafka: { condition: service_healthy } }
    ports: ["127.0.0.1:50053:50053"]
  analytics-service:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: analytics-service } }
    environment: { ANALYTICS_ADDR: ":50054", ANALYTICS_HTTP_ADDR: ":9104", CLICKHOUSE_URL: "http://app:app@clickhouse:8123" }
    depends_on: { clickhouse: { condition: service_healthy } }
    ports: ["127.0.0.1:50054:50054"]
  analytics-worker:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: analytics-worker } }
    environment: { KAFKA_BROKERS: "kafka:9092", CLICKHOUSE_URL: "http://app:app@clickhouse:8123", ANALYTICS_WORKER_HTTP_ADDR: ":9105" }
    depends_on: { kafka: { condition: service_healthy }, clickhouse: { condition: service_healthy } }
  api-gateway:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: api-gateway } }
    environment:
      GATEWAY_ADDR: ":8080"
      IDENTITY_ADDR: "identity-service:50051"
      TASK_ADDR: "task-service:50052"
      ACTIVITY_ADDR: "activity-service:50053"
      ANALYTICS_ADDR: "analytics-service:50054"
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes: [ keys:/keys:ro ]
    depends_on:
      identity-service: { condition: service_started }
      task-service: { condition: service_started }
      activity-service: { condition: service_started }
    ports: ["8080:8080"]
  frontend:
    build: { context: .., dockerfile: deploy/frontend.Dockerfile }
    depends_on: { api-gateway: { condition: service_started } }
    ports: ["3000:80"]
  prometheus:
    # v2.53.4 is a stable amd64 build for local Docker Desktop and Render parity.
    image: prom/prometheus:v2.53.4
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes: [ ./prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./grafana/alerts.yml:/etc/prometheus/alerts.yml:ro ]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    # 11.5.x includes a stable plugin installer for the ClickHouse datasource.
    image: grafana/grafana:11.5.2
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer, GF_INSTALL_PLUGINS: grafana-clickhouse-datasource }
    volumes: [ ./grafana/provisioning:/etc/grafana/provisioning:ro, ./grafana/dashboards:/var/lib/grafana/dashboards:ro ]
    depends_on: { prometheus: { condition: service_started }, clickhouse: { condition: service_healthy } }
    ports: ["127.0.0.1:3001:3000"]
volumes:
  keys:
  clickhouse-data:
