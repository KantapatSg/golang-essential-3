global:
  scrape_interval: 15s
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ['api-gateway:8080'] }]
  - job_name: identity
    static_configs: [{ targets: ['identity-service:9101'] }]
  - job_name: task
    static_configs: [{ targets: ['task-service:9102'] }]
  - job_name: activity
    static_configs: [{ targets: ['activity-service:9103'] }]
  - job_name: analytics
    static_configs: [{ targets: ['analytics-service:9104'] }]
  - job_name: analytics-worker
    static_configs: [{ targets: ['analytics-worker:9105'] }]
