global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ['api-gateway:8080'], labels: { service: gateway } }]
  - job_name: identity
    static_configs: [{ targets: ['identity-service:9101'], labels: { service: identity } }]
  - job_name: task
    static_configs: [{ targets: ['task-service:9102'], labels: { service: task } }]
  - job_name: activity
    static_configs: [{ targets: ['activity-service:9103'], labels: { service: activity } }]
  - job_name: analytics
    static_configs: [{ targets: ['analytics-service:9104'], labels: { service: analytics } }]
  - job_name: analytics-worker
    static_configs: [{ targets: ['analytics-worker:9105'], labels: { service: analytics_worker } }]
  - job_name: inventory
    static_configs: [{ targets: ['inventory-service:9106'], labels: { service: inventory } }]
  - job_name: order
    static_configs: [{ targets: ['order-service:9107'], labels: { service: order } }]
  - job_name: payment
    static_configs: [{ targets: ['payment-service:9108'], labels: { service: payment } }]
  - job_name: notification
    static_configs: [{ targets: ['notification-service:9109'], labels: { service: notification } }]
