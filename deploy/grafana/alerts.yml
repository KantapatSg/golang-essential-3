groups:
  - name: signal-ledger
    rules:
      - alert: ServiceNotReady
        expr: up == 0 or service_ready == 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Service is not ready", impact: "Requests may fail or be routed away", runbook: "docs/21_OBSERVABILITY_RUNBOOK.md#service-not-ready" }
      - alert: AnalyticsIngestionDelayed
        expr: analytics_ingestion_delay_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Analytics ingestion delay is high", impact: "Dashboard data is stale", runbook: "docs/21_OBSERVABILITY_RUNBOOK.md#analytics-delay" }
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_lag > 100
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Kafka consumer lag is high", impact: "Activity or analytics projections are stale", runbook: "docs/21_OBSERVABILITY_RUNBOOK.md#analytics-delay" }
