server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Local Compose keeps browser calls same-origin; Render can use VITE_API_BASE_URL.
  location /api/ { proxy_pass http://api-gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Request-ID $http_x_request_id; }
  location = /openapi.yaml { proxy_pass http://api-gateway:8080/openapi.yaml; proxy_set_header Host $host; }
  location /swagger/ { proxy_pass http://api-gateway:8080; proxy_set_header Host $host; }
  location = /health/live { proxy_pass http://api-gateway:8080/health/live; }
  location = /health/ready { proxy_pass http://api-gateway:8080/health/ready; }
  location / { try_files $uri $uri/ /index.html; }
}
